<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/fonts.css">
</head>

<body>
    <main>
        <h1>Memory Game von VORNAME NACHNAME</h1>
        <p>Merk dir, wo die Gegenstände liegen.</p>
        <p>
            Sobald du das Spiel startest, werden die Bilder ausgeblendet.
        </p>
        <p>
            Du erhältst Bestellungen und musst die passenden Gegenstände finden,
            indem du auf ihren Button klickst.
        </p>
        <div id="game">
            <div class="grid"></div>
            <div class="question"></div>
            <div class="score"></div>
            <div class="timer"></div>
            <button class="start-btn">Start Game</button>

        </div>
    </main>
    <script type="module" src="./script.js"></script>
</body>

</html>
