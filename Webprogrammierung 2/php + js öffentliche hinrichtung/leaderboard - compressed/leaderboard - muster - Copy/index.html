<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🏆 Leaderboard 🏆</title>

    <link rel="stylesheet" href="./styles.css">

</head>

<body>

<main>

    <h1>🏆 Leaderboard 🏆</h1>

    <h2>Add Score</h2>

    <form
        method="post"
        action="add.php"
    >

        <input
            type="text"
            name="player"
            placeholder="Player"
            required
        >
         
        <input
            type="number"
            name="points"
            placeholder="Points"
            required
        >

        <input
            type="date"
            name="played_at"
            required
        >

        <input
            type="text"
            name="avatar"
            placeholder="Avatar URL"
        >

        <button type="submit">
            Add Score
        </button>

    </form>

    <div id="radio-group">

        <label>
            <input
                type="radio"
                name="orderby"
                value="points"
                checked
            >
            Sort by Points
        </label>

        <label>
            <input
                type="radio"
                name="orderby"
                value="date"
            >
            Sort by Date
        </label>

        <label>
            <input
                type="radio"
                name="orderby"
                value="player"
            >
            Sort by Player
        </label>

    </div>

       <div id="cards-wrapper">

            <div class="card">

                <span>1</span>

                <img

                    alt="Player Name"
                >

                <span>Player Name</span>

                <span>Points</span>

                <span>Date</span>

            </div>

        </div>


        <span class="credits">
            Avatars by https://www.avatarsinpixels.com/pony/
        </span>

<script

></script>

</html>
